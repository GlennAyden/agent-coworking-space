services:
  agent-coworking-space:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 10001
        APP_GID: 10001
    container_name: agent-coworking-space
    restart: unless-stopped
    env_file:
      - .env.docker
      - .env.docker.private
    environment:
      HOST: 0.0.0.0
      DB_PATH: /app/data/agent-coworking-space.sqlite
      LOGS_DIR: /app/data/logs
      BACKUP_DIR: /app/data/backups
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./data:/app/data
    working_dir: /app
    security_opt:
      - no-new-privileges:true
